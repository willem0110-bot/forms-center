<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星安表格中心</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --brick:#B84A2F;
  --brick-dark:#9A3D26;
  --cream:#F7F3EC;
  --paper:#FFFDF8;
  --ink:#3E3A34;
  --muted:#8A8378;
  --line:#E5DFD3;
  --green:#4C7A4C;
  --blue:#3D6B8E;
  --amber:#C08A2D;
  --red:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Noto Sans TC","PingFang TC",sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  font-size:16px;
}
/* ===== 載入畫面 ===== */
#loading{
  position:fixed;inset:0;background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;
}
.spinner{
  width:42px;height:42px;border:4px solid var(--line);
  border-top-color:var(--brick);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--muted);font-size:14px}
/* ===== 錯誤畫面 ===== */
#error-view{display:none;padding:60px 24px;text-align:center}
#error-view .icon{font-size:52px;margin-bottom:16px}
#error-view h2{font-size:20px;margin-bottom:10px}
#error-view p{color:var(--muted);font-size:14px;line-height:1.7}
/* ===== 頂欄 ===== */
header{
  background:var(--brick);color:#fff;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
header .title{font-size:17px;font-weight:700;letter-spacing:1px}
header .user{font-size:13px;opacity:.92;margin-top:2px}
#logout-btn{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;
}
/* ===== 主畫面卡片 ===== */
#home{display:none;padding:20px 16px 40px;max-width:560px;margin:0 auto}
.section-label{font-size:13px;color:var(--muted);margin:4px 2px 12px;letter-spacing:2px}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:18px;margin-bottom:14px;cursor:pointer;
  display:flex;align-items:center;gap:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  transition:transform .08s;
}
.card:active{transform:scale(.98)}
.card .emoji{
  font-size:30px;width:58px;height:58px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.card h3{font-size:17px;margin-bottom:3px}
.card p{font-size:13px;color:var(--muted);line-height:1.5}
.card .arrow{margin-left:auto;color:var(--muted);font-size:20px}
.c-fridge .emoji{background:#EAF2F7}
.c-toy .emoji{background:#F5EFE2}
.c-clean .emoji{background:#EBF2EA}
/* ===== 表單頁 ===== */
.form-view{display:none;max-width:560px;margin:0 auto;padding:18px 16px 60px}
.back-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.back-btn{
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink);
}
.form-title{font-size:18px;font-weight:700}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin-bottom:14px;
}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
input[type=date],input[type=number],input[type=text],select,textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  font-size:16px;background:#fff;color:var(--ink);font-family:inherit;
}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brick);border-color:transparent}
.submit-btn{
  width:100%;background:var(--brick);color:#fff;border:none;border-radius:12px;
  padding:15px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:2px;
}
.submit-btn:disabled{opacity:.5}
.secondary-btn{
  width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:12px;font-size:14px;cursor:pointer;margin-top:10px;
}
/* ===== 班級選擇 chips ===== */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);
  background:#fff;font-size:15px;cursor:pointer;
}
.chip.active{background:var(--brick);color:#fff;border-color:var(--brick);font-weight:700}
/* ===== 清潔項目清單 ===== */
.area-block{margin-bottom:14px}
.area-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:700;color:var(--brick-dark);
  padding:6px 2px;border-bottom:1.5px solid var(--line);margin-bottom:6px;
}
.area-head .mini{font-size:12px;color:var(--muted);font-weight:400;cursor:pointer;text-decoration:underline}
.item-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;
  border-bottom:1px dashed var(--line);
}
.item-row:last-child{border-bottom:none}
.item-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--brick);flex-shrink:0}
.item-row .iname{font-size:15px;flex:1}
.item-row .ifreq{font-size:11px;color:var(--muted);background:var(--cream);padding:3px 8px;border-radius:6px;flex-shrink:0}
.item-row .del{
  display:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 6px;flex-shrink:0;
}
body.manage-mode .item-row .del{display:block}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.tool-btn{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);font-size:13px;cursor:pointer;color:var(--ink);
}
.tool-btn.on{background:var(--brick);color:#fff;border-color:var(--brick)}
.progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px}
/* ===== 新增項目列 ===== */
#add-item-box{display:none;background:var(--cream);border-radius:12px;padding:14px;margin-bottom:12px}
#add-item-box .row{display:flex;gap:8px;margin-bottom:8px}
#add-item-box input,#add-item-box select{padding:10px;font-size:14px}
/* ===== 近期紀錄 ===== */
.recent-table{width:100%;border-collapse:collapse;font-size:12.5px}
.recent-table th{background:var(--cream);padding:8px 6px;text-align:left;white-space:nowrap}
.recent-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.recent-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge-ok{color:var(--green);font-weight:700}
.badge-bad{color:var(--red);font-weight:700}
/* ===== Toast ===== */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  max-width:86vw;text-align:center;line-height:1.5;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.warn{background:var(--red)}
/* ===== 提交遮罩 ===== */
#busy{
  display:none;position:fixed;inset:0;background:rgba(62,58,52,.35);
  z-index:150;align-items:center;justify-content:center;
}
#busy .box{background:#fff;border-radius:14px;padding:22px 30px;display:flex;gap:14px;align-items:center}
</style>
</head>
<body>

<!-- 載入中 -->
<div id="loading"><div class="spinner"></div><p>正在確認身分…</p></div>

<!-- 錯誤 -->
<div id="error-view">
  <div class="icon">🔒</div>
  <h2>無法進入表格中心</h2>
  <p id="error-msg">此 LINE 帳號未在星安授權清單中。<br>請聯絡園長協助開通權限。</p>
</div>

<!-- 頂欄 -->
<header id="topbar" style="display:none">
  <div>
    <div class="title">🗂️ 星安表格中心</div>
    <div class="user" id="user-line">－</div>
  </div>
  <button id="logout-btn" onclick="fullLogout()">登出</button>
</header>

<!-- ===== 主畫面 ===== -->
<div id="home">
  <p class="section-label">— 請選擇要填寫的表格 —</p>

  <div class="card c-fridge" onclick="openForm('fridge')">
    <div class="emoji">🧊</div>
    <div><h3>冰箱溫度記錄</h3><p>每日紀錄冷凍／冷藏溫度<br>冷凍 ≤ -18°C・冷藏 ≤ 7°C</p></div>
    <div class="arrow">›</div>
  </div>

  <div class="card c-clean" onclick="openForm('clean')">
    <div class="emoji">🧽</div>
    <div><h3>環境清潔消毒記錄</h3><p>各班每日清潔消毒打勾<br>項目可自行增減</p></div>
    <div class="arrow">›</div>
  </div>

  <div class="card c-toy" onclick="openForm('toy')">
    <div class="emoji">🧸</div>
    <div><h3>教玩具檢修紀錄</h3><p>教玩具損壞、送修、報廢登記</p></div>
    <div class="arrow">›</div>
  </div>
</div>

<!-- ===== 冰箱溫度 ===== -->
<div class="form-view" id="view-fridge">
  <div class="back-bar">
    <button class="back-btn" onclick="goHome()">‹ 返回</button>
    <span class="form-title">🧊 冰箱溫度記錄</span>
  </div>
  <div class="panel">
    <div class="field">
      <label>紀錄日期</label>
      <input type="date" id="fridge-date">
    </div>
    <div class="field">
      <label>冷凍庫溫度（°C）<span class="hint">標準：低於 -18°C</span></label>
      <input type="number" id="fridge-freezer" step="0.1" inputmode="decimal" placeholder="例如：-19.5">
    </div>
    <div class="field">
      <label>冷藏庫溫度（°C）<span class="hint">標準：低於 7°C</span></label>
      <input type="number" id="fridge-fridge" step="0.1" inputmode="decimal" placeholder="例如：4.0">
    </div>
    <button class="submit-btn" id="fridge-submit" onclick="submitFridge()">送出紀錄</button>
    <button class="secondary-btn" onclick="loadRecent('fridge')">📋 查看近期紀錄</button>
  </div>
  <div class="panel" id="fridge-recent" style="display:none"></div>
</div>

<!-- ===== 清潔消毒 ===== -->
<div class="form-view" id="view-clean">
  <div class="back-bar">
    <button class="back-btn" onclick="goHome()">‹ 返回</button>
    <span class="form-title">🧽 環境清潔消毒</span>
  </div>
  <div class="panel">
    <div class="field">
      <label>紀錄日期</label>
      <input type="date" id="clean-date">
    </div>
    <div class="field">
      <label>班級</label>
      <div class="chips" id="clean-class-chips"></div>
    </div>
  </div>
  <div class="panel">
    <div class="toolbar">
      <button class="tool-btn" onclick="checkAll(true)">✓ 全部勾選</button>
      <button class="tool-btn" onclick="checkAll(false)">✗ 全部清除</button>
      <button class="tool-btn" id="manage-btn" onclick="toggleManage()">⚙️ 管理項目</button>
    </div>
    <div id="add-item-box">
      <div class="row">
        <input type="text" id="ai-area" placeholder="區域（如：教室環境）" style="flex:1">
        <select id="ai-freq" style="width:110px">
          <option>每日一次</option><option>每週一次</option><option>每月一次</option>
        </select>
      </div>
      <div class="row">
        <input type="text" id="ai-name" placeholder="項目名稱（如：紗窗）" style="flex:1">
        <button class="tool-btn on" style="width:90px" onclick="addItem()">＋新增</button>
      </div>
    </div>
    <div class="progress" id="clean-progress">已勾選 0 項</div>
    <div id="clean-items"></div>
    <button class="submit-btn" style="margin-top:14px" id="clean-submit" onclick="submitCleaning()">送出紀錄</button>
    <button class="secondary-btn" onclick="loadRecent('cleaning')">📋 查看近期紀錄</button>
  </div>
  <div class="panel" id="cleaning-recent" style="display:none"></div>
</div>

<!-- ===== 教玩具檢修 ===== -->
<div class="form-view" id="view-toy">
  <div class="back-bar">
    <button class="back-btn" onclick="goHome()">‹ 返回</button>
    <span class="form-title">🧸 教玩具檢修</span>
  </div>
  <div class="panel">
    <div class="field">
      <label>檢修日期</label>
      <input type="date" id="toy-date">
    </div>
    <div class="field">
      <label>檢修項目<span class="hint">哪一個教玩具</span></label>
      <input type="text" id="toy-item" placeholder="例如：木質積木組">
    </div>
    <div class="field">
      <label>檢修原因</label>
      <input type="text" id="toy-reason" placeholder="例如：邊角破損有刮傷風險">
    </div>
    <div class="field">
      <label>維修方式</label>
      <select id="toy-method">
        <option value="自行維修">自行維修</option>
        <option value="需送修廠商">需送修廠商</option>
        <option value="報廢">報廢</option>
      </select>
    </div>
    <div class="field">
      <label>處理結果</label>
      <select id="toy-result">
        <option value="">（尚未處理）</option>
        <option value="正常">正常</option>
        <option value="直接報廢">直接報廢</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="field">
      <label>備註<span class="hint">選填</span></label>
      <textarea id="toy-note" placeholder="其他補充說明"></textarea>
    </div>
    <button class="submit-btn" id="toy-submit" onclick="submitToy()">送出紀錄</button>
    <button class="secondary-btn" onclick="loadRecent('toy')">📋 查看近期紀錄</button>
  </div>
  <div class="panel" id="toy-recent" style="display:none"></div>
</div>

<!-- Toast & Busy -->
<div id="toast"></div>
<div id="busy"><div class="box"><div class="spinner" style="width:26px;height:26px;border-width:3px"></div><span>處理中…</span></div></div>

<script>
/* ============================================================
 * 星安表格中心 前端 v1.0
 * ============================================================ */
var LIFF_ID = '2009933933-IbeAZQgL';
var API = 'https://script.google.com/macros/s/AKfycbzLvST9ap5Ovvyz8m30UJIJSFkZvYYSzQ5kAuOBwcAeT2XiYQFQ-OvetcnQMZqHNxTO7Q/exec';
var IDLE_LIMIT = 10 * 60 * 1000; // 閒置 10 分鐘自動登出

var state = {
  uid: '',
  user: null,
  classList: [],
  items: [],
  selectedClass: '',
  lastActivity: Date.now()
};

/* ---------- 初始化 ---------- */
window.addEventListener('DOMContentLoaded', init);

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href.split('#')[0].split('?')[0] });
      return;
    }
    var profile = await liff.getProfile();
    state.uid = profile.userId;
    var res = await api({ action: 'getInitData' });
    if (!res.ok) {
      showError(res.message || '授權失敗，請聯絡園長開通權限。');
      return;
    }
    state.user = res.user;
    state.classList = res.classList || [];
    state.items = res.cleaningItems || [];
    renderApp(res.today);
    startIdleWatch();
  } catch (err) {
    showError('系統初始化失敗：' + (err && err.message ? err.message : err));
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').innerHTML = msg;
  document.getElementById('error-view').style.display = 'block';
}

function renderApp(today) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('home').style.display = 'block';
  var u = state.user;
  document.getElementById('user-line').textContent =
    (u.role ? u.role + '・' : '') + u.name + ' 您好';
  // 三張表日期預設今天
  var d = toInputDate(today);
  ['fridge-date', 'clean-date', 'toy-date'].forEach(function (id) {
    document.getElementById(id).value = d;
  });
  renderClassChips();
  renderItems();
}

function toInputDate(s) {
  // yyyy/MM/dd -> yyyy-MM-dd
  if (!s) { var n = new Date(); s = n.getFullYear() + '/' + (n.getMonth() + 1) + '/' + n.getDate(); }
  var p = s.split('/');
  return p[0] + '-' + String(p[1]).padStart(2, '0') + '-' + String(p[2]).padStart(2, '0');
}
function fromInputDate(s) { return s ? s.replace(/-/g, '/') : ''; }

/* ---------- API ---------- */
async function api(payload) {
  payload.uid = state.uid;
  var r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // 避免 CORS 預檢
    body: JSON.stringify(payload)
  });
  return r.json();
}

/* ---------- 畫面切換 ---------- */
function openForm(name) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('view-' + name).style.display = 'block';
  window.scrollTo(0, 0);
}
function goHome() {
  document.querySelectorAll('.form-view').forEach(function (v) { v.style.display = 'none'; });
  document.getElementById('home').style.display = 'block';
  window.scrollTo(0, 0);
}

/* ---------- Toast / Busy ---------- */
var toastTimer = null;
function toast(msg, warn) {
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.className = warn ? 'show warn' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, 3200);
}
function busy(on) { document.getElementById('busy').style.display = on ? 'flex' : 'none'; }

/* ============================================================
 * 冰箱溫度
 * ============================================================ */
async function submitFridge() {
  var freezer = document.getElementById('fridge-freezer').value;
  var fridge = document.getElementById('fridge-fridge').value;
  if (freezer === '' || fridge === '') { toast('請輸入冷凍庫與冷藏庫溫度', true); return; }
  busy(true);
  try {
    var res = await api({
      action: 'submitFridge',
      date: fromInputDate(document.getElementById('fridge-date').value),
      freezer: freezer, fridge: fridge
    });
    busy(false);
    if (!res.ok) { toast(res.message || '送出失敗', true); return; }
    if (res.abnormal) {
      toast('⚠️ 已記錄，但溫度異常：<br>' + res.warnings.join('<br>') + '<br>請儘速檢查冰箱！', true);
    } else {
      toast('✅ 冰箱溫度已記錄（正常）');
    }
    document.getElementById('fridge-freezer').value = '';
    document.getElementById('fridge-fridge').value = '';
  } catch (e) { busy(false); toast('連線失敗，請再試一次', true); }
}

/* ============================================================
 * 教玩具檢修
 * ============================================================ */
async function submitToy() {
  var item = document.getElementById('toy-item').value.trim();
  if (!item) { toast('請填寫檢修項目', true); return; }
  busy(true);
  try {
    var res = await api({
      action: 'submitToyRepair',
      date: fromInputDate(document.getElementById('toy-date').value),
      item: item,
      reason: document.getElementById('toy-reason').value.trim(),
      method: document.getElementById('toy-method').value,
      result: document.getElementById('toy-result').value,
      note: document.getElementById('toy-note').value.trim()
    });
    busy(false);
    if (!res.ok) { toast(res.message || '送出失敗', true); return; }
    toast('✅ 檢修紀錄已登記（編號 ' + res.serial + '）');
    ['toy-item', 'toy-reason', 'toy-note'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('toy-result').value = '';
  } catch (e) { busy(false); toast('連線失敗，請再試一次', true); }
}

/* ============================================================
 * 環境清潔消毒
 * ============================================================ */
function renderClassChips() {
  var wrap = document.getElementById('clean-class-chips');
  wrap.innerHTML = '';
  state.classList.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip' + (state.selectedClass === c ? ' active' : '');
    b.textContent = c;
    b.onclick = function () { state.selectedClass = c; renderClassChips(); };
    wrap.appendChild(b);
  });
}

function renderItems() {
  var wrap = document.getElementById('clean-items');
  wrap.innerHTML = '';
  var areas = {};
  state.items.forEach(function (it) {
    if (!areas[it.area]) areas[it.area] = [];
    areas[it.area].push(it);
  });
  Object.keys(areas).forEach(function (area) {
    var block = document.createElement('div');
    block.className = 'area-block';
    var head = document.createElement('div');
    head.className = 'area-head';
    head.innerHTML = '<span>＊' + esc(area) + '</span><span class="mini" onclick="checkArea(\'' + esc(area) + '\')">整區勾選</span>';
    block.appendChild(head);
    areas[area].forEach(function (it) {
      var row = document.createElement('label');
      row.className = 'item-row';
      row.innerHTML =
        '<input type="checkbox" data-name="' + esc(it.name) + '" data-area="' + esc(it.area) + '" onchange="updateProgress()">' +
        '<span class="iname">' + esc(it.name) + '</span>' +
        '<span class="ifreq">' + esc(it.freq) + '</span>' +
        '<span class="del" data-id="' + esc(it.id) + '" onclick="removeItem(event,\'' + esc(it.id) + '\',\'' + esc(it.name) + '\')">🗑</span>';
      block.appendChild(row);
    });
    wrap.appendChild(block);
  });
  updateProgress();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function allChecks() { return Array.prototype.slice.call(document.querySelectorAll('#clean-items input[type=checkbox]')); }
function checkAll(v) { allChecks().forEach(function (c) { c.checked = v; }); updateProgress(); }
function checkArea(area) {
  allChecks().forEach(function (c) { if (c.dataset.area === area) c.checked = true; });
  updateProgress();
}
function updateProgress() {
  var n = allChecks().filter(function (c) { return c.checked; }).length;
  document.getElementById('clean-progress').textContent = '已勾選 ' + n + ' 項 / 共 ' + state.items.length + ' 項';
}

function toggleManage() {
  var on = document.body.classList.toggle('manage-mode');
  document.getElementById('manage-btn').classList.toggle('on', on);
  document.getElementById('add-item-box').style.display = on ? 'block' : 'none';
}

async function addItem() {
  var area = document.getElementById('ai-area').value.trim();
  var name = document.getElementById('ai-name').value.trim();
  var freq = document.getElementById('ai-freq').value;
  if (!area || !name) { toast('請填寫區域與項目名稱', true); return; }
  busy(true);
  try {
    var res = await api({ action: 'addCleaningItem', area: area, name: name, freq: freq });
    busy(false);
    if (!res.ok) { toast(res.message || '新增失敗', true); return; }
    state.items = res.items;
    renderItems();
    document.getElementById('ai-name').value = '';
    toast('✅ 已新增項目「' + name + '」');
  } catch (e) { busy(false); toast('連線失敗', true); }
}

async function removeItem(ev, id, name) {
  ev.preventDefault(); ev.stopPropagation();
  if (!confirm('確定要移除項目「' + name + '」嗎？\n（歷史紀錄不會受影響，之後也可請 Claude 協助恢復）')) return;
  busy(true);
  try {
    var res = await api({ action: 'toggleCleaningItem', id: id });
    busy(false);
    if (!res.ok) { toast('移除失敗', true); return; }
    state.items = res.items;
    renderItems();
    toast('已移除「' + name + '」');
  } catch (e) { busy(false); toast('連線失敗', true); }
}

async function submitCleaning() {
  if (!state.selectedClass) { toast('請先選擇班級', true); return; }
  var checked = allChecks().filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.name; });
  if (!checked.length) { toast('請至少勾選一個清潔項目', true); return; }
  busy(true);
  try {
    var res = await api({
      action: 'submitCleaning',
      date: fromInputDate(document.getElementById('clean-date').value),
      className: state.selectedClass,
      checked: checked
    });
    busy(false);
    if (!res.ok) { toast(res.message || '送出失敗', true); return; }
    toast('✅ ' + state.selectedClass + '班清潔紀錄已送出（' + res.count + '／' + res.total + ' 項）');
    checkAll(false);
  } catch (e) { busy(false); toast('連線失敗，請再試一次', true); }
}

/* ============================================================
 * 近期紀錄
 * ============================================================ */
async function loadRecent(form) {
  busy(true);
  try {
    var res = await api({ action: 'getRecent', form: form, n: 10 });
    busy(false);
    if (!res.ok) { toast('查詢失敗', true); return; }
    var boxId = { fridge: 'fridge-recent', cleaning: 'cleaning-recent', toy: 'toy-recent' }[form];
    var box = document.getElementById(boxId);
    if (!res.rows.length) { box.style.display = 'block'; box.innerHTML = '<p style="color:var(--muted);text-align:center">目前還沒有紀錄</p>'; return; }
    var hideCols = [];
    res.headers.forEach(function (h, i) { if (String(h).indexOf('UID') !== -1 || h === '建立時間戳') hideCols.push(i); });
    var html = '<div class="recent-wrap"><table class="recent-table"><tr>';
    res.headers.forEach(function (h, i) { if (hideCols.indexOf(i) === -1) html += '<th>' + esc(h) + '</th>'; });
    html += '</tr>';
    res.rows.forEach(function (r) {
      html += '<tr>';
      r.forEach(function (v, i) {
        if (hideCols.indexOf(i) !== -1) return;
        var cell = esc(v);
        if (v === '正常') cell = '<span class="badge-ok">正常</span>';
        if (v === '異常') cell = '<span class="badge-bad">異常</span>';
        html += '<td>' + cell + '</td>';
      });
      html += '</tr>';
    });
    html += '</table></div>';
    box.style.display = 'block';
    box.innerHTML = html;
  } catch (e) { busy(false); toast('連線失敗', true); }
}

/* ============================================================
 * 閒置自動登出（手機背景相容：時間戳比較）＋ 完全登出
 * ============================================================ */
function bumpActivity() { state.lastActivity = Date.now(); }
['touchstart', 'click', 'keydown', 'scroll'].forEach(function (evt) {
  window.addEventListener(evt, bumpActivity, { passive: true });
});

function startIdleWatch() {
  bumpActivity();
  setInterval(checkIdle, 30 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkIdle();
  });
}
function checkIdle() {
  if (Date.now() - state.lastActivity > IDLE_LIMIT) fullLogout(true);
}

function fullLogout(isIdle) {
  try { if (liff.isLoggedIn && liff.isLoggedIn()) liff.logout(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (isIdle) alert('閒置超過 10 分鐘，為保護資料安全已自動登出。');
  location.replace(location.origin + location.pathname);
}
